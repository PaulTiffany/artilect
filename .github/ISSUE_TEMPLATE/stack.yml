name: "Drop a production"
description: "Submit the GitHub repo that made your video, music, or other creative work—complete with pinned upstream submodules."
title: "[STACK] "
body:
  - type: markdown
    attributes:
      value: |
        **Make the thing first.** [Download the Artilect starter](https://paultiffany.github.io/artilect/artilect-starter.zip), or [browse the agent-readable starter branch](https://github.com/PaulTiffany/artilect/tree/submission-template). Your repository is both the finished track and its production recipe.
  - type: input
    id: week
    attributes:
      label: "Week (YYYY-MM-DD)"
      description: "Wednesday's showcase date."
      placeholder: "2026-10-21"
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: "Production repository URL"
      description: "Link to your publicly accessible, finished GitHub production repository with README.md, AGENTS.md, artilect.json and direct technologies/ submodules."
      placeholder: "https://github.com/your-handle/robot-jazz"
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: "Before you drop"
      options:
        - label: "My repository produces the described work, credits the original upstream technology creators, and may be linked publicly on Artilect."
          required: true
