name: "Drop a battle entry"
description: "Show the crowd what you made with this week's selected stack."
title: "[BATTLE] "
body:
  - type: markdown
    attributes:
      value: |
        **Pass the mic.** Link to your own hosted media. Don't upload large video files to the Git repository. Credit the sampled technologies and original authors.
  - type: input
    id: week
    attributes:
      label: "Battle week (YYYY-MM-DD)"
      placeholder: "2026-10-21"
    validations:
      required: true
  - type: input
    id: producer
    attributes:
      label: "Producer or battler"
      placeholder: "Your display name or handle"
    validations:
      required: true
  - type: input
    id: stack
    attributes:
      label: "Selected stack path"
      placeholder: "stacks/2026-10-21/paul"
      description: "Use the exact accepted stack directory in Artilect."
    validations:
      required: true
  - type: input
    id: media
    attributes:
      label: "Video/audio URL"
      placeholder: "https://www.youtube.com/watch?v=..."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "What did you flip? Upstream credits and production notes"
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: "Showcase permission"
      options:
        - label: "I have permission to link or embed this media publicly and have identified necessary upstream credits."
          required: true
