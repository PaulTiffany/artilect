name: Propose direct upstream submodules

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing [STACK] issue number to process"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[STACK]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate URLs and propose pinned Git submodule PR
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const issueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number)
              : context.issue.number;
            const response = await github.rest.issues.get({owner, repo, issue_number: issueNumber});
            const issue = response.data;
            if (!issue.title.startsWith('[STACK]') || issue.pull_request) {
              core.setFailed('Not a [STACK] issue'); return;
            }
            const body = issue.body || '';
            const field = label => {
              const marker = '### ' + label;
              const p = body.indexOf(marker);
              if (p === -1) throw Error('Missing issue-form field: ' + label);
              const rest = body.slice(p + marker.length).split(/\n### /)[0].trim();
              return rest === '_No response_' ? '' : rest;
            };
            try {
              const week = field('Week (YYYY-MM-DD)');
              const handle = field('Contributor GitHub handle').toLowerCase();
              if (!/^\d{4}-\d{2}-\d{2}$/.test(week) ||
                  new Date(week + 'T00:00:00Z').toISOString().slice(0,10) !== week ||
                  new Date(week + 'T00:00:00Z').getUTCDay() !== 3) {
                throw Error('Week must be a valid Wednesday in YYYY-MM-DD');
              }
              if (!/^[a-z0-9](?:[a-z0-9_-]{0,37}[a-z0-9])?$/.test(handle)) {
                throw Error('Contributor must be a safe handle (letters, digits, - or _)');
              }
              const raw = field('Upstream technologies (one GitHub repository URL per line)')
                .split(/\r?\n/).map(s => s.trim()).filter(Boolean);
              if (raw.length < 2 || raw.length > 8) throw Error('Provide 2–8 direct upstream GitHub repositories');
              const seen = new Set(), entries = [];
              for (const url of raw) {
                const match = /^https:\/\/github\.com\/([A-Za-z0-9-]+)\/([A-Za-z0-9_.-]+?)(?:\.git)?\/?$/.exec(url);
                if (!match || match[2] === '.' || match[2] === '..') throw Error('Only direct https://github.com/owner/repository URLs are allowed: ' + url);
                const upstream = await github.rest.repos.get({owner:match[1],repo:match[2]});
                if (upstream.data.private || upstream.data.disabled) throw Error('Upstream must be accessible and public: '+url);
                if (upstream.data.full_name.toLowerCase() === (owner+'/'+repo).toLowerCase()) throw Error('Artilect itself is not an upstream technology');
                const key = upstream.data.full_name.toLowerCase();
                if (seen.has(key)) throw Error('Duplicate upstream repository: '+key);
                seen.add(key);
                const head = await github.rest.repos.getBranch({
                  owner:upstream.data.owner.login, repo:upstream.data.name,
                  branch:upstream.data.default_branch
                });
                let slug = upstream.data.name.toLowerCase();
                if (entries.some(e => e.slug === slug)) slug = (upstream.data.owner.login + '-' + upstream.data.name).toLowerCase();
                if (entries.some(e => e.slug === slug)) throw Error('Repository path collision');
                entries.push({slug, sha:head.data.commit.sha, url:upstream.data.html_url+'.git', name:upstream.data.full_name});
              }
              const branchName = 'submissions/issue-' + issueNumber;
              const branchExists = await github.rest.git.getRef({owner,repo,ref:'heads/'+branchName}).then(()=>true,e=>{
                if(e.status===404) return false; throw e;
              });
              if (branchExists) {core.notice('Proposal already exists on branch '+branchName);return;}
              const base = await github.rest.repos.getBranch({owner,repo,branch:'main'});
              const baseSha = base.data.commit.sha;
              const gitCommit = await github.rest.git.getCommit({owner,repo,commit_sha:baseSha});
              let modules = await github.rest.repos.getContent({owner,repo,path:'.gitmodules',ref:'main'})
                .then(r=>Buffer.from(r.data.content,'base64').toString('utf8'),e=>{
                  if(e.status===404) return ''; throw e;
                });
              const prefix = 'stacks/'+week+'/'+handle+'/';
              if (modules.includes('path = '+prefix)) throw Error('Contributor already has a submission for this week');
              const trees = [];
              for(const e of entries) {
                const path=prefix+e.slug;
                modules += '\n[submodule "'+path+'"]\n\tpath = '+path+'\n\turl = '+e.url+'\n';
                trees.push({path, mode:'160000', type:'commit', sha:e.sha});
              }
              const blob=await github.rest.git.createBlob({owner,repo,content:modules.trimStart(),encoding:'utf-8'});
              trees.push({path:'.gitmodules',mode:'100644',type:'blob',sha:blob.data.sha});
              const tree=await github.rest.git.createTree({owner,repo,base_tree:gitCommit.data.tree.sha,tree:trees});
              const commit=await github.rest.git.createCommit({
                owner,repo,message:'Add upstream composition '+week+'/'+handle+' (issue #'+issueNumber+')',
                tree:tree.data.sha, parents:[baseSha]
              });
              await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branchName,sha:commit.data.sha});
              const notes=field('What can your composition do, and who made the upstream work?');
              const pr=await github.rest.pulls.create({
                owner,repo,head:branchName,base:'main',
                title:'[Stack] '+week+' / '+handle,
                body:'Closes #'+issueNumber+'\n\n**Direct pinned upstream submodules:**\n'+entries.map(e=>'- '+e.name+' @ `'+e.sha+'`').join('\n')+
                  '\n\n**Submitter notes:**\n'+notes+'\n\nReview authors, licenses, repo identity, safety, and proposed composition before merging. No upstream code was run.'
              });
              await github.rest.issues.createComment({owner,repo,issue_number:issueNumber,
                body:'🎤 Stack proposal is ready for review: #'+pr.data.number+'. The upstream repositories are pinned directly, without wrappers.'});
            } catch(error) {
              core.setFailed(error.message);
              await github.rest.issues.createComment({owner,repo,issue_number:issueNumber,
                body:'Unable to propose this stack automatically: '+String(error.message).slice(0,500)+'\n\nPlease correct the submission or ask a maintainer to rerun the workflow.'});
            }
