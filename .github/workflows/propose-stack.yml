name: Propose completed Artilect production

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing [STACK] issue number"
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  propose:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, '[STACK]')
    runs-on: ubuntu-latest
    steps:
      - name: Validate and pin complete production repository
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const num = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs.issue_number) : context.issue.number;
            const {data: issue} = await github.rest.issues.get({owner,repo,issue_number:num});
            if (!issue.title.startsWith('[STACK]') || issue.pull_request) {
              core.setFailed('Not a stack submission issue'); return;
            }
            const field = name => {
              const marker = '### ' + name;
              const body = issue.body || '';
              const pos = body.indexOf(marker);
              if(pos<0) throw Error('Missing field: '+name);
              return body.slice(pos+marker.length).split(/\n### /)[0].trim();
            };
            const fileAt = async (sourceOwner,sourceRepo,path,ref) => {
              const {data}=await github.rest.repos.getContent({
                owner:sourceOwner,repo:sourceRepo,path,ref
              });
              if(Array.isArray(data)||data.type!=='file'||!data.content) throw Error('Missing file: '+path);
              return Buffer.from(data.content,'base64').toString('utf8');
            };
            const nonplaceholder = s => typeof s === 'string' && !!s.trim() && !s.includes('TODO');
            try {
              const week=field('Week (YYYY-MM-DD)');
              const raw=field('Production repository URL');
              if(!/^\d{4}-\d{2}-\d{2}$/.test(week)||
                 new Date(week+'T00:00:00Z').toISOString().slice(0,10)!==week||
                 new Date(week+'T00:00:00Z').getUTCDay()!==3) throw Error('Week must be a valid Wednesday');
              const match=/^https:\/\/github\.com\/([A-Za-z0-9-]+)\/([A-Za-z0-9_.-]+?)(?:\.git)?\/?$/.exec(raw);
              if(!match) throw Error('Use a direct HTTPS GitHub repository URL');
              const {data: source}=await github.rest.repos.get({owner:match[1],repo:match[2]});
              if(source.private||source.disabled||source.archived) throw Error('Production repository must be public, active, and accessible');
              if(source.full_name.toLowerCase()===(owner+'/'+repo).toLowerCase()) throw Error('Submit your production repo, not Artilect itself');
              if(source.owner.type==='User'&&source.owner.login.toLowerCase()!==issue.user.login.toLowerCase())
                throw Error('Submit a repository you own; organization repositories can be reviewed separately');
              const sOwner=source.owner.login,sRepo=source.name;
              const {data: head}=await github.rest.repos.getBranch({owner:sOwner,repo:sRepo,branch:source.default_branch});
              const sha=head.commit.sha;
              const meta=JSON.parse(await fileAt(sOwner,sRepo,'artilect.json',sha));
              if(meta.schema!==1||!['title','summary','reproduce','rights_notes'].every(k=>nonplaceholder(meta[k])))
                throw Error('Complete artilect.json with schema 1 and real title, summary, reproduction and rights notes');
              const media=meta.media_url||'';
              const mediaPath=meta.media_path||'';
              if(!media&&!mediaPath) throw Error('Link or include a real creative output in artilect.json');
              if(media&&!/^https:\/\//i.test(media)) throw Error('Public media URL must use HTTPS');
              await Promise.all(['README.md','AGENTS.md','production/README.md'].map(
                path=>fileAt(sOwner,sRepo,path,sha)));
              const modules=await fileAt(sOwner,sRepo,'.gitmodules',sha);
              const {data: gitCommit}=await github.rest.git.getCommit({owner:sOwner,repo:sRepo,commit_sha:sha});
              const {data: tree}=await github.rest.git.getTree({
                owner:sOwner,repo:sRepo,tree_sha:gitCommit.tree.sha,recursive:'true'
              });
              if(tree.truncated) throw Error('Production repository tree is too large to validate safely');
              const linkPaths=new Set(tree.tree.filter(x=>x.mode==='160000').map(x=>x.path));
              if(mediaPath){
                if(!/^output\/[A-Za-z0-9_./-]+$/.test(mediaPath)||mediaPath.includes('..')||
                   !tree.tree.some(x=>x.path===mediaPath&&x.type==='blob'))
                  throw Error('media_path must reference a committed file inside output/');
              }
              const upstream=[];
              let section=null;
              for(const line of modules.split(/\r?\n/)){
                const m=/^\[submodule "([^"]+)"\]$/.exec(line.trim());
                if(m){section={};upstream.push(section);continue;}
                if(!section)continue;
                const value=/^\s*(path|url)\s*=\s*(.*?)\s*$/.exec(line);
                if(value)section[value[1]]=value[2];
              }
              if(upstream.length<2) throw Error('Provide at least two directly submoduled upstream technologies');
              const seen=new Set();
              for(const t of upstream){
                if(!t.path||!/^technologies\/[a-zA-Z0-9_.-]+$/.test(t.path)||
                   seen.has(t.path)||!linkPaths.has(t.path))
                  throw Error('Each technology must be a unique, tracked direct submodule inside technologies/');
                if(!/^https:\/\/github\.com\/[A-Za-z0-9-]+\/[A-Za-z0-9_.-]+(?:\.git)?$/.test(t.url||''))
                  throw Error('Upstream technologies must link to original public GitHub HTTPS repositories');
                seen.add(t.path);
              }
              if(linkPaths.size!==upstream.length) throw Error('Unexpected gitlink outside declared direct technology paths');
              const contributor=issue.user.login.toLowerCase();
              const path='stacks/'+week+'/'+contributor;
              const branchName='submissions/issue-'+num;
              const exists=await github.rest.git.getRef({owner,repo,ref:'heads/'+branchName})
                .then(()=>true,e=>{if(e.status===404)return false;throw e});
              if(exists){core.notice('Existing proposal: '+branchName);return;}
              const {data:base}=await github.rest.repos.getBranch({owner,repo,branch:'main'});
              const {data:baseCommit}=await github.rest.git.getCommit({owner,repo,commit_sha:base.commit.sha});
              let register=await github.rest.repos.getContent({owner,repo,path:'.gitmodules',ref:'main'})
                .then(r=>Buffer.from(r.data.content,'base64').toString('utf8'),e=>{
                  if(e.status===404)return '';throw e});
              if(register.includes('path = '+path+'\n')||register.includes('path = '+path+'\r\n'))
                throw Error('Contributor already has a stack recorded for this Wednesday');
              register=register.trimEnd()+'\n[submodule "'+path+'"]\n\tpath = '+path+
                '\n\turl = '+source.html_url+'.git\n';
              const {data:blob}=await github.rest.git.createBlob({owner,repo,content:register,encoding:'utf-8'});
              const {data:nextTree}=await github.rest.git.createTree({owner,repo,base_tree:baseCommit.tree.sha,
                tree:[
                  {path:'.gitmodules',mode:'100644',type:'blob',sha:blob.sha},
                  {path,mode:'160000',type:'commit',sha}
                ]});
              const {data:commit}=await github.rest.git.createCommit({
                owner,repo,message:'Record production '+week+'/'+contributor+' (#'+num+')',
                parents:[base.commit.sha],tree:nextTree.sha
              });
              await github.rest.git.createRef({owner,repo,ref:'refs/heads/'+branchName,sha:commit.sha});
              const {data:pr}=await github.rest.pulls.create({owner,repo,
                base:'main',head:branchName,title:'[Production] '+week+' / '+contributor,
                body:'Closes #'+num+'\n\n**'+meta.title+'** — '+meta.summary+
                  '\n\n**Production repository:** '+source.html_url+' @ `'+sha+'`'+
                  '\n\n**Upstream direct submodules:**\n'+upstream.map(t=>'- '+t.path+' → '+t.url).join('\n')+
                  '\n\n**Media:** '+(media||mediaPath)+
                  '\n\nMaintainer: review rights, provenance and creative output. No submitted code was executed.'
              });
              await github.rest.issues.createComment({owner,repo,issue_number:num,
                body:'🎤 Your complete production is pinned as a proposed weekly submodule: #'+pr.number+'. All upstream technology submodules remain inside your production repo.'});
            }catch(error){
              core.setFailed(error.message);
              await github.rest.issues.createComment({owner,repo,issue_number:num,
                body:'Could not propose this production: '+String(error.message).slice(0,500)+
                  '\n\nFix the repository and re-run **Propose completed Artilect production** with this issue number.'});
            }
