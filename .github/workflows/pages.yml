name: Publish Artilect stage

on:
  push:
    branches: [main]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 3"

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: artilect-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved source and Gitlinks only
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false
          persist-credentials: false
      - name: Checkout trusted site generator
        uses: actions/checkout@v4
        with:
          ref: site-source
          path: _site_src
          persist-credentials: false
          submodules: false
      - name: Checkout agent-ready production starter
        uses: actions/checkout@v4
        with:
          ref: submission-template
          path: _starter_src
          persist-credentials: false
          submodules: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from approved Gitlinks and public issue records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTILECT_ROOT: .
          ARTILECT_OUT: _pages
          ARTILECT_TEMPLATE: _starter_src
        run: python _site_src/site/build.py
      - name: Validate weekly archive and browser JavaScript
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          out = Path("_pages")
          html = (out / "index.html").read_text(encoding="utf8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S | re.I)
          assert len(scripts) == 1, "Expected one inline site script"
          (out / "_browser-check.js").write_text(scripts[0], encoding="utf8")
          data = json.loads((out / "site-data.json").read_text(encoding="utf8"))
          assert all(key in data for key in ("stacks", "battles", "weeks", "active_week"))
          assert any(w["week"] == data["active_week"] for w in data["weeks"])
          assert sum(w["productions"] for w in data["weeks"]) == len(data["stacks"])
          assert sum(w["battles"] for w in data["weeks"]) == len(data["battles"])
          PY
          node --check _pages/_browser-check.js
          rm _pages/_browser-check.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
