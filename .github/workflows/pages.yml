name: Publish Artilect stage

on:
  push:
    branches: [main, site-source]
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "17 12 * * 3"

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: artilect-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout approved source and Gitlinks only
        uses: actions/checkout@v4
        with:
          ref: main
          submodules: false
          persist-credentials: false
      - name: Checkout trusted site generator
        uses: actions/checkout@v4
        with:
          ref: site-source
          path: _site_src
          persist-credentials: false
          submodules: false
      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build site from approved Gitlinks and public issue records
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTILECT_ROOT: .
          ARTILECT_OUT: _pages
        run: python _site_src/site/build.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
